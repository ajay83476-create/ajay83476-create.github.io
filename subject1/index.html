<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>B.Com Semester 5 | Ajay Chauhan</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #222;
}

/* HEADER */

header {
    background: #111827;
    color: white;
    padding: 25px 20px;
    text-align: center;
}

header h1 {
    font-size: 30px;
    margin-bottom: 8px;
}

header p {
    color: #d1d5db;
    font-size: 15px;
}

/* CONTAINER */

.container {
    max-width: 1000px;
    margin: 40px auto;
    padding: 0 20px;
}

/* BACK BUTTON */

.back {
    display: inline-block;
    margin-bottom: 25px;
    text-decoration: none;
    color: #2563eb;
    font-weight: bold;
}

.back:hover {
    text-decoration: underline;
}

/* TITLE */

.title {
    text-align: center;
    margin-bottom: 35px;
}

.title h2 {
    font-size: 32px;
    margin-bottom: 10px;
}

.title p {
    color: #666;
    font-size: 16px;
}

/* UNIT GRID */

.unit-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}

/* UNIT CARD */

.unit {
    background: white;
    padding: 28px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    transition: 0.3s;
}
